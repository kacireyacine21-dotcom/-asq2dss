<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة زرقاء خاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050c;
            font-family: 'Tajawal', sans-serif;
            color: #fff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* واجهة التحكم العلوية */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        button {
            background: rgba(16, 37, 82, 0.7);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #93c5fd;
            padding: 10px 18px;
            border-radius: 25px;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        button:hover {
            background: rgba(37, 99, 235, 0.6);
            border-color: #60a5fa;
            color: #fff;
            transform: translateY(-2px);
        }
        /* بطاقة الإهداء والكتابة السفلية */
        .dedication-card {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            background: rgba(10, 18, 42, 0.75);
            border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 18px 32px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(37, 99, 235, 0.2);
            max-width: 90%;
            width: 450px;
            transition: all 0.4s ease;
        }
        .dedication-card:hover {
            border-color: rgba(96, 165, 250, 0.8);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7), 0 0 35px rgba(59, 130, 246, 0.35);
        }
        .dedication-title {
            font-family: 'Amiri', serif;
            font-size: 24px;
            color: #93c5fd;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(147, 197, 253, 0.4);
            outline: none;
        }
        .dedication-text {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
            font-weight: 300;
            outline: none;
        }
        .edit-hint {
            font-size: 11px;
            color: rgba(147, 197, 253, 0.55);
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- أزرار التفاعل -->
    <div class="top-controls">
        <button id="bloomBtn">🌸 ضمّ البتلات</button>
        <button id="rotateBtn">⏸️ إيقاف الدوران</button>
    </div>

    <!-- بطاقة الكتابة السفلية القابلة للتعديل -->
    <div class="dedication-card">
        <div class="dedication-title" contenteditable="true">وردة زرقاء تليق بكِ 💙</div>
        <div class="dedication-text" contenteditable="true">
            لأن الأشياء النادرة والجميلة تستحق ما يشبهها.. صُنعت هذه الوردة خصيصاً لأجلك.
        </div>
        <span class="edit-hint">اضغط على النص لتعديله مباشرة • اسحب بالماوس لتدوير الوردة</span>
    </div>

    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. إعداد المشهد والكاميرا مع خلفية داكنة ثابتة
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03050c);
        scene.fog = new THREE.FogExp2(0x03050c, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.2, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 12;
        controls.target.set(0, 0.4, 0);

        // 2. الإضاءة السينمائية
        const ambientLight = new THREE.AmbientLight(0x1e3a8a, 1.4);
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(0x60a5fa, 3.0, 20);
        mainLight.position.set(3, 5, 4);
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x93c5fd, 2.0);
        rimLight.position.set(-4, 3, -3);
        scene.add(rimLight);

        const innerGlow = new THREE.PointLight(0x2563eb, 2.2, 5);
        innerGlow.position.set(0, 1.2, 0);
        scene.add(innerGlow);

        // 3. بناء الوردة الزرقاء ثلاثية الأبعاد
        const roseGroup = new THREE.Group();
        scene.add(roseGroup);

        function createPetalGeometry(width, height, curvature) {
            const geo = new THREE.PlaneGeometry(width, height, 16, 16);
            const pos = geo.attributes.position;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i) + height / 2;
                let z = pos.getZ(i);

                const u = x / (width / 2);
                const v = y / height;

                const widthProfile = Math.sin(v * Math.PI * 0.85) * (1 - 0.2 * v);
                x *= widthProfile;

                const cup = (1 - u * u) * Math.sin(v * Math.PI) * curvature;
                const curlBack = Math.pow(v, 2.5) * (curvature * 0.65);
                z = cup - curlBack;

                pos.setXYZ(i, x, y, z);
            }
            geo.computeVertexNormals();
            return geo;
        }

        const petals = [];
        const totalPetals = 34;
        const goldenAngle = 137.5 * (Math.PI / 180);

        for (let i = 0; i < totalPetals; i++) {
            const progress = i / totalPetals;

            const color = new THREE.Color().setHSL(
                0.60 - progress * 0.03,
                0.85 + progress * 0.1,
                0.15 + Math.pow(progress, 1.3) * 0.38
            );

            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.45,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            const w = 0.45 + progress * 0.95;
            const h = 0.65 + progress * 0.95;
            const curve = 0.18 + progress * 0.22;

            const petalGeo = createPetalGeometry(w, h, curve);
            const petalMesh = new THREE.Mesh(petalGeo, material);

            const angle = i * goldenAngle;
            const radius = 0.06 + progress * 0.35;
            const yOffset = 1.1 - progress * 0.22;

            const pivot = new THREE.Group();
            pivot.position.set(Math.cos(angle) * radius, yOffset, Math.sin(angle) * radius);
            pivot.rotation.y = -angle + Math.PI / 2;

            const openTilt = 0.18 + Math.pow(progress, 1.15) * 1.15;
            const closedTilt = 0.05 + progress * 0.25;

            petalMesh.rotation.x = openTilt;
            pivot.add(petalMesh);
            roseGroup.add(pivot);

            petals.push({
                mesh: petalMesh,
                openAngle: openTilt,
                closedAngle: closedTilt,
                currentAngle: openTilt
            });
        }

        // 4. الساق الخضراء الداكنة والأوراق
        const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 1.0, 0),
            new THREE.Vector3(0.05, 0.2, 0.03),
            new THREE.Vector3(-0.04, -0.8, -0.02),
            new THREE.Vector3(0, -2.2, 0)
        ]);
        const stemGeo = new THREE.TubeGeometry(stemCurve, 20, 0.045, 8, false);
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.6 });
        const stem = new THREE.Mesh(stemGeo, stemMat);
        roseGroup.add(stem);

        function createLeaf(yPos, rotY, scale) {
            const leafGeo = createPetalGeometry(0.5, 0.9, 0.1);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x065f46,
                roughness: 0.5,
                side: THREE.DoubleSide
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(0, yPos, 0);
            leaf.rotation.y = rotY;
            leaf.rotation.x = 1.1;
            leaf.scale.set(scale, scale, scale);
            roseGroup.add(leaf);
        }
        createLeaf(0.1, 0.5, 0.9);
        createLeaf(-0.4, 3.6, 1.0);

        // 5. جزيئات ضوئية سحرية (غبار النجوم الأزرق)
        const particlesCount = 220;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.04,
            color: 0x60a5fa,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        // 6. منطق التفاعل والأزرار
        let isBloomed = true;
        let isRotating = true;

        const bloomBtn = document.getElementById('bloomBtn');
        bloomBtn.addEventListener('click', () => {
            isBloomed = !isBloomed;
            bloomBtn.textContent = isBloomed ? '🌸 ضمّ البتلات' : '🌹 تفتيح الوردة';
        });

        const rotateBtn = document.getElementById('rotateBtn');
        rotateBtn.addEventListener('click', () => {
            isRotating = !isRotating;
            rotateBtn.textContent = isRotating ? '⏸️ إيقاف الدوران' : '▶️ تشغيل الدوران';
        });

        // 7. حلقة التحريك المستمرة
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            petals.forEach((p, idx) => {
                const target = isBloomed ? p.openAngle : p.closedAngle;
                p.currentAngle += (target - p.currentAngle) * 0.05;
                const breathe = Math.sin(elapsedTime * 1.5 + idx * 0.2) * 0.015;
                p.mesh.rotation.x = p.currentAngle + breathe;
            });

            if (isRotating) {
                roseGroup.rotation.y += 0.005;
            }

            roseGroup.position.y = Math.sin(elapsedTime * 1.2) * 0.08;
            particlesMesh.rotation.y = elapsedTime * 0.04;
            particlesMesh.position.y = Math.sin(elapsedTime * 0.5) * 0.1;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
